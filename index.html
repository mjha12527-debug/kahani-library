<!doctype html>
<html lang="hi">
<head><link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>स्वागत है - कहानी पुस्तकालय</title>
    <style>
        /* पेज का बैकग्राउंड और बीच में रखने का तरीका */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f0e8; /* क्रीम रंग */
            font-family: sans-serif;
            color: #222;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* सफ़ेद बॉक्स (कार्ड) */
        .gate {
            background: #fff;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        
        /* आपके लोगो की सेटिंग */
        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        /* टाइटल और टेक्स्ट */
        h1 {
            color: #7a3b12;
            margin: 0 0 10px 0;
            font-size: 26px;
        }
        p {
            color: #555;
            margin-bottom: 25px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        /* प्रवेश वाला बटन */
        .btn {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            background: #7a3b12;
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
            border: none;
            transition: 0.3s;
        }
        .btn:hover {
            background: #5a2a0d;
        }
    </style>
</head>
<body>
    <div class="gate">
        
        <!-- आपका लोगो यहाँ लगा है -->
        <img src="logo.png" class="logo-img" alt="कहानी पुस्तकालय लोगो">
        
        <!-- टाइटल और जानकारी -->
        <h1>📚 कहानी पुस्तकालय</h1>
        <p>यहाँ आपको मिलेंगी रोचक, प्रेरणादायक और मनोरंजक कहानियाँ।</p>
        
        <!-- लाइब्रेरी में जाने का बटन -->
        <a href="library.html" class="btn">पुस्तकालय में प्रवेश करें ➔</a>
        
    </div>
</body>
</html>
